name: Backend CI/CD Pipeline - Google Cloud Run

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PROJECT_ID: 'elaborate-night-511823-t6'
  REGION: 'us-central1'
  SERVICE_NAME: 'pagaopiu-backend'
  REPOSITORY: 'pagaopiu-repo'

jobs:
  # ══════════════════════════════════════════════════════════════
  # ETAPA 1: INTEGRACIÓN CONTINUA (CI) - Compilación y Tests
  # ══════════════════════════════════════════════════════════════
  ci-build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔧 Dar permisos de ejecución al Maven Wrapper
        run: chmod +x ./mvnw

      - name: 🧪 Ejecutar pruebas unitarias e integración
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RENIEC_PROVIDER: "simulado"
          RENIEC_API_URL: "https://api.json.pe/api/dni"
          RENIEC_API_TOKEN: ${{ secrets.RENIEC_API_TOKEN }}
          FRONTEND_URL: "http://localhost:5173"
        run: ./mvnw clean test -B

      - name: 📦 Empaquetar artefacto ejecutable (.jar)
        run: ./mvnw package -DskipTests -B

      - name: 📤 Publicar artefacto .jar en el pipeline
        uses: actions/upload-artifact@v4
        with:
          name: pagaopiu-backend-jar
          path: target/*.jar
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # ETAPA 2: DESPLIEGUE CONTINUO (CD) - Google Cloud Run
  # ══════════════════════════════════════════════════════════════
  cd-deploy-to-cloud-run:
    name: Deploy to Google Cloud Run (CD)
    needs: ci-build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔑 Autenticación en Google Cloud con Service Account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🛠️ Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🏗️ Construir y Subir imagen Docker a Artifact Registry
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
        run: |
          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: 🚀 Desplegar contenedor en Google Cloud Run
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          DB_URL_VAL: ${{ secrets.DB_URL }}
          DB_USER_VAL: ${{ secrets.DB_USERNAME }}
          DB_PASS_VAL: ${{ secrets.DB_PASSWORD }}
          RENIEC_PROV_VAL: ${{ secrets.RENIEC_PROVIDER }}
          RENIEC_URL_VAL: ${{ secrets.RENIEC_API_URL }}
          RENIEC_TOK_VAL: ${{ secrets.RENIEC_API_TOKEN }}
          FRONT_URL_VAL: ${{ secrets.FRONTEND_URL }}
          STORAGE_PROV_VAL: ${{ secrets.STORAGE_PROVIDER }}
          CLD_NAME_VAL: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLD_KEY_VAL: ${{ secrets.CLOUDINARY_API_KEY }}
          CLD_SEC_VAL: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          RENIEC_PROVIDER="${RENIEC_PROV_VAL:-api}"
          RENIEC_API_URL="${RENIEC_URL_VAL:-https://api.json.pe/api/dni}"
          FRONTEND_URL="${FRONT_URL_VAL:-http://localhost:5173}"
          STORAGE_PROVIDER="${STORAGE_PROV_VAL:-local}"
          if [ -n "$CLD_NAME_VAL" ] && [ -n "$CLD_KEY_VAL" ] && [ -n "$CLD_SEC_VAL" ]; then
            STORAGE_PROVIDER="cloudinary"
          fi

          ENV_VARS="DB_URL=${DB_URL_VAL},DB_USERNAME=${DB_USER_VAL},DB_PASSWORD=${DB_PASS_VAL},RENIEC_PROVIDER=${RENIEC_PROVIDER},RENIEC_API_URL=${RENIEC_API_URL},RENIEC_API_TOKEN=${RENIEC_TOK_VAL},FRONTEND_URL=${FRONTEND_URL},STORAGE_PROVIDER=${STORAGE_PROVIDER},CLOUDINARY_CLOUD_NAME=${CLD_NAME_VAL},CLOUDINARY_API_KEY=${CLD_KEY_VAL},CLOUDINARY_API_SECRET=${CLD_SEC_VAL}"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "$ENV_VARS" \
            --quiet

      - name: 🌐 Mostrar URL pública del Backend desplegado
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "=========================================================="
          echo "🎉 ¡BACKEND DESPLEGADO EXITOSAMENTE EN GOOGLE CLOUD RUN! 🎉"
          echo "URL Pública del Backend: $URL"
          echo "=========================================================="
