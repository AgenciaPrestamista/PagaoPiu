spring.application.name=pagaopiu

# ── Datasource PostgreSQL ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# ── Encoding UTF-8 ──
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8

# ── Negocio ──
app.prestamo.monto-minimo=1
app.prestamo.monto-maximo=10000
app.prestamo.tea=0.30

# ── RENIEC EXCLUSIVO PARA TESTS (SIMULADO / 0 TOKENS) ──
app.reniec.provider=simulado
app.reniec.api.url=https://api.json.pe/api/dni
app.reniec.api.token=

# ── Origen del Frontend para CORS ──
app.frontend.url=${FRONTEND_URL}

