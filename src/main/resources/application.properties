spring.application.name=pagaopiu
server.port=${PORT:8080}
    
# ── Datasource PostgreSQL ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# ── Encoding UTF-8 ──
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8

# ── Negocio ──
app.prestamo.monto-minimo=1
app.prestamo.monto-maximo=10000
app.prestamo.tea=0.30

# ── Carga de contratos firmados y vouchers ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.contrato.storage-dir=${STORAGE_DIR:./uploads/contratos}
app.contrato.max-size-bytes=5242880
app.contrato.storage-provider=${STORAGE_PROVIDER:local}

# ── Cloudinary (Variables de entorno con fallback seguro) ──
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── RENIEC (api.json.pe / simulado) ──
app.reniec.provider=${RENIEC_PROVIDER:api}
app.reniec.api.url=${RENIEC_API_URL:https://api.json.pe/api/dni}
app.reniec.api.token=${RENIEC_API_TOKEN:}

# ── Cookies de Sesión Cross-Site (Cloud Run <-> Frontend) ──
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# ── Origen del Frontend para CORS ──
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
